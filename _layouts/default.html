<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="brand">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
        <p class="site-description">{{ site.description }}</p>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
        <span class="theme-icon">🌗</span>
        <span class="theme-text">Switch Mode</span>
      </button>
    </div>
  </header>

  <main class="main-content wrapper">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Hosted on GitHub Pages.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Process Jekyll Kramdown ```mermaid code blocks
      const mermaidBlocks = document.querySelectorAll('.language-mermaid, pre.mermaid, code.language-mermaid');
      mermaidBlocks.forEach((el) => {
        const code = el.textContent.trim();
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.style.textAlign = 'center';
        mermaidDiv.style.margin = '2rem 0';
        mermaidDiv.textContent = code;

        const container = el.closest('.highlighter-rouge') || el.closest('pre') || el;
        if (container && container.parentNode) {
          container.parentNode.replaceChild(mermaidDiv, container);
        }
      });

      // 2. Initialize Mermaid
      if (window.mermaid) {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
          (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        
        mermaid.initialize({
          startOnLoad: true,
          theme: isDark ? 'dark' : 'default',
          securityLevel: 'loose'
        });
      }

      // 3. Theme Switch Listener
      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const currentTheme = document.documentElement.getAttribute('data-theme');
          let newTheme = 'dark';
          
          if (currentTheme === 'dark') {
            newTheme = 'light';
          } else if (!currentTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            newTheme = 'light';
          }
          
          document.documentElement.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);

          // Reload page to re-render Mermaid cleanly under new theme
          location.reload();
        });
      }
    });
  </script>
</body>
</html>
